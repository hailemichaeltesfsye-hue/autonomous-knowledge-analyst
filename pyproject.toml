[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-knowledge-analyst"
version = "0.1.0"
description = "Stateful autonomous agent for AI and automation adoption research in Africa"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-groq>=0.1.0",
    "langchain-community>=0.2.0",
    "chromadb>=0.4.24",
    "streamlit>=1.30.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=2.2.2",
    "pydantic>=2.0.0",
    "ddgs>=9.15.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
